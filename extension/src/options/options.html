<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="options.css" />
  <title>LifeLensIQ Tracker — Options</title>
</head>
<body>
  <main>
    <div class="topbar">
      <h1>LifeLensIQ Tracker — Options</h1>
      <button id="theme-btn" class="icon-btn" title="Toggle theme" aria-label="Toggle theme">
        <svg class="ico-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
        </svg>
        <svg class="ico-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
        </svg>
      </button>
    </div>

    <section>
      <h2>Domain → Category overrides</h2>
      <p class="muted">
        These rules override the built-in classifier. Saved to your Firebase account and cached
        locally so classification works offline. e.g. <code>youtube.com</code> →
        <code>Study</code> if you follow coding channels.
      </p>
      <div class="form-row">
        <input id="domain" type="text" placeholder="domain, e.g. youtube.com" />
        <select id="category"></select>
        <button id="add-btn">Add</button>
      </div>
      <ul id="list"></ul>
    </section>

    <section class="actions">
      <button id="save-btn">Save to Firebase</button>
      <button id="local-btn" class="secondary">Save locally only</button>
      <button id="clear-btn" class="danger">Remove all overrides</button>
      <span id="status" class="muted"></span>
    </section>
  </main>

  <script src="options.js"></script>
</body>
</html>
