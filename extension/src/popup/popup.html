<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="popup.css" />
  <title>LifeLensIQ Tracker</title>
</head>
<body>
  <header>
    <h1>LifeLensIQ Tracker</h1>
    <div class="head-right">
      <button id="theme-btn" class="icon-btn" title="Toggle theme" aria-label="Toggle theme">
        <svg class="ico-sun" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
        </svg>
        <svg class="ico-moon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
        </svg>
      </button>
      <span id="status-dot" class="dot" title="Tracking status"></span>
    </div>
  </header>

  <section id="auth-view" class="hidden">
    <p class="muted">Sign in with your LifeLensIQ Firebase account to start syncing.</p>
    <form id="login-form">
      <input id="email" type="email" placeholder="email@example.com" autocomplete="username" required />
      <input id="password" type="password" placeholder="password" autocomplete="current-password" required />
      <button type="submit" id="signin-btn">Sign in</button>
    </form>
    <p id="auth-error" class="error hidden"></p>
  </section>

  <section id="app-view" class="hidden">
    <div class="row"><span>Signed in as</span><strong id="user-email"></strong></div>
    <div class="row">
      <span>Tracking</span>
      <label class="switch">
        <input type="checkbox" id="pause-toggle" />
        <span class="slider"></span>
        <span id="pause-label">On</span>
      </label>
    </div>
    <div class="row"><span>Live session</span><strong id="live-session">—</strong></div>
    <div class="row"><span>Today (local buffer)</span><strong id="today-active">—</strong></div>
    <div class="row"><span>Events pending sync</span><strong id="pending-sync">—</strong></div>
    <div class="row"><span>Last sync</span><strong id="last-sync">—</strong></div>

    <div class="section">
      <div class="sec-title">Focus mode</div>
      <div class="row">
        <span>Status</span><strong id="focus-status" class="focus-off">off</strong>
      </div>
      <input id="focus-allowlist" placeholder="allowlisted domains, comma-separated" />
      <div class="btn-row">
        <button id="focus-toggle" class="accent">Start focus</button>
      </div>
    </div>

    <div class="section">
      <div class="sec-title">Pomodoro</div>
      <div class="pomo-display"><span id="pomo-time">25:00</span><span id="pomo-phase" class="muted">focus</span></div>
      <div class="btn-row">
        <button id="pomo-toggle">Start</button>
        <button id="pomo-reset" class="secondary">Reset</button>
      </div>
    </div>

    <div class="section" id="weekly-nudge"></div>

    <div class="cat-summary" id="cat-summary"></div>

    <div class="btn-row">
      <button id="sync-btn">Sync now</button>
      <button id="dashboard-btn">Open dashboard</button>
      <button id="options-btn">Options</button>
      <button id="logout-btn" class="danger">Sign out</button>
    </div>
  </section>

  <footer class="muted">Passive tracking is on. Segment min: 5s · sync: every 1 min.</footer>

  <script src="popup.js"></script>
</body>
</html>
